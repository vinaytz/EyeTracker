[project]
name = "eyetracker"
version = "0.1.0"
description = "Local, lightweight blink and screen-time tracker for your webcam. Stores numbers, never video."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["mediapipe>=1.2,<2", "numpy>=2"]

[project.scripts]
eyetracker = "eyetracker.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eyetracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
